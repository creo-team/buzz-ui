name: CI
run-name: CI [${{ github.ref_name }}] triggered by [${{ github.event_name }}/${{ github.actor }}]

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The publish workflow runs the same ICU-pinned tests (prepublishOnly) and cannot read .nvmrc.
      - name: Publish workflow pins the .nvmrc Node
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(sed -n "s/^ *node_version: *'\([^']*\)'.*/\1/p" .github/workflows/node-publish.yaml)"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=.github/workflows/node-publish.yaml::node_version '$actual' must equal .nvmrc '$expected'"
            exit 1
          fi

      - name: Install
        run: npm ci

      # The site typechecks against the library's built dist (its real
      # exports map), so the library build comes first.
      - name: Build library (includes RSC boundary verification)
        run: npm run -w @creo-team/buzz-ui build

      - name: Typecheck (library + site)
        run: npm run typecheck

      - name: Test (library)
        run: npm test

      - name: Build site
        run: npm run -w @buzz-ui/site build
